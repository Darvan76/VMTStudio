name: CI/CD

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options: [Release, Debug, Both]
      create_release:
        description: Publish release (select the matching version tag and Release or Both)
        required: false
        default: false
        type: boolean
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test ${{ matrix.configuration }} (Windows x64 + Win32)
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON((github.event_name != 'workflow_dispatch' || github.event.inputs.configuration == 'Both') && '["Release","Debug"]' || format('["{0}"]', github.event.inputs.configuration)) }}
    env:
      BUILD_CONFIG: ${{ matrix.configuration }}
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check sources and release version
        env:
          PUBLISH_REQUESTED: ${{ github.event.inputs.create_release }}
          REQUESTED_CONFIGURATION: ${{ github.event.inputs.configuration }}
        run: |
          & ./scripts/check_source_integrity.ps1
          $project = Get-Content CMakeLists.txt -Raw
          if ($project -notmatch '(?ms)project\s*\([^)]*VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') {
            throw 'Cannot read application version.'
          }
          $version = $Matches[1]
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag must match CMake version: v$version."
          }
          if ($env:PUBLISH_REQUESTED -eq 'true' -and
              ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:REQUESTED_CONFIGURATION -eq 'Debug')) {
            throw 'Publishing requires the matching version tag and a Release build.'
          }

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.2'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: 'C:/'

      - name: Apply VTFLib patches
        run: |
          cmake -P thirdparty/patches/apply_vtflib_patches.cmake
          if ($LASTEXITCODE -ne 0) { throw 'VTFLib patching failed.' }

      - name: Build VTFLib++ (Win32 & x64)
        run: |
          foreach ($build in @(
            @{ Architecture = 'Win32'; Directory = 'build_vtflib' },
            @{ Architecture = 'x64'; Directory = 'build_vtflib64' }
          )) {
            cmake -G 'Visual Studio 17 2022' -S thirdparty/vtflib -B "thirdparty/vtflib/$($build.Directory)" `
              -A $build.Architecture -DVTFLIB_BUILD_VTFCMD=OFF -DVTFLIB_BUILD_VTFEDIT=OFF -DCMAKE_DEBUG_POSTFIX=_d
            if ($LASTEXITCODE -ne 0) { throw 'VTFLib configuration failed.' }
            cmake --build "thirdparty/vtflib/$($build.Directory)" --config $env:BUILD_CONFIG --target vtflib --parallel 2
            if ($LASTEXITCODE -ne 0) { throw 'VTFLib build failed.' }
          }

      - name: Checkout pinned Source SDK 2013 public headers
        run: |
          $sdk = "$env:RUNNER_TEMP/source-sdk-2013"
          git clone --filter=blob:none --no-checkout https://github.com/ValveSoftware/source-sdk-2013.git $sdk
          if ($LASTEXITCODE -ne 0) { throw 'Source SDK clone failed.' }
          git -C $sdk sparse-checkout set src/public
          if ($LASTEXITCODE -ne 0) { throw 'Source SDK sparse checkout failed.' }
          git -C $sdk checkout b8cfb12c0e083a2ef5b2f9f9b50f3902fa034474
          if ($LASTEXITCODE -ne 0) { throw 'Source SDK pinned checkout failed.' }

      - name: Build 32-bit backend (HLMV)
        run: |
          $sdkPublic = "$env:RUNNER_TEMP/source-sdk-2013/src/public" -replace '\\', '/'
          cmake -G 'Visual Studio 17 2022' -S . -B build -A Win32 "-DSOURCE_SDK_PUBLIC=$sdkPublic"
          if ($LASTEXITCODE -ne 0) { throw 'Win32 configuration failed.' }
          cmake --build build --config $env:BUILD_CONFIG --target hlmv_backend --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Win32 backend build failed.' }

      - name: Build 64-bit application and tests
        run: |
          cmake -G 'Visual Studio 17 2022' -S . -B build64 -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'x64 configuration failed.' }
          cmake --build build64 --config $env:BUILD_CONFIG --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'x64 build failed.' }

      - name: Run CTest unit tests
        run: |
          ctest --test-dir build64 -C $env:BUILD_CONFIG --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw 'CTest failed.' }

      - name: Package verified distribution
        run: |
          & ./scripts/package_release.ps1 -Config $env:BUILD_CONFIG

      - name: Build portable executable
        if: matrix.configuration == 'Release'
        run: |
          & ./scripts/build_single_exe.ps1 -Config Release -UseExistingPackage

      - name: Generate SHA-256 checksums
        run: |
          $assets = Get-ChildItem dist -File | Where-Object { $_.Extension -in @('.zip', '.exe') } | Sort-Object Name
          if (-not $assets) { throw 'No release artifacts were produced.' }
          $assets | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath dist/SHA256SUMS -Encoding ascii

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vmtstudio-${{ matrix.configuration == 'Release' && 'release' || 'debug' }}-windows-x64
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish verified release
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Release artifacts
        uses: actions/download-artifact@v4
        with:
          name: vmtstudio-release-windows-x64
          path: dist

      - name: Publish ZIP, portable executable and checksums
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
